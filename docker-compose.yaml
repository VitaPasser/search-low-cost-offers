services:
  observer-houses-offers-fastapi:
    build:
      context: .
      dockerfile: fastapi.Dockerfile
    volumes:
      - ./data/:/home/dev/app/data/
      - ./resource:/home/dev/app/resource
      - ./logs/:/home/dev/app/logs/
      - ${WEB_DRIVER_PATH}:/home/dev/app/chromium.chromedriver:ro
    expose:
      - 8000
    environment:
      - REDIS_HOST=redis
      - IS_TESTING=0
      - LOGGING_DIR_PATH=/home/dev/app/logs/
    depends_on:
      - redis
    networks:
      - observer_network

  observer-houses-offers-celery:
    build:
      context: .
      dockerfile: celery.Dockerfile
    volumes:
      - ./data/:/home/dev/app/data/
      - ./resource:/home/dev/app/resource
      - ${WEB_DRIVER_PATH}:/home/dev/app/chromium.chromedriver:ro
      - ./logs/:/home/dev/app/logs/
    expose:
      - 8000
    environment:
      - REDIS_HOST=redis
      - IS_TESTING=0
      - LOGGING_DIR_PATH=/home/dev/app/logs/
    depends_on:
      - redis
    networks:
      - observer_network

  frontend:
    build: https://github.com/VitaPasser/search-low-cost-offers-frontend.git
    ports:
      - "8080:8501"
    environment:
      - API_URL=http://observer-houses-offers-fastapi:8000/api/v1
    depends_on:
      - observer-houses-offers-fastapi
    networks:
      - observer_network

  redis:
    image: redis:8.10.1
    container_name: shop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - observer_network

volumes:
  redis_data:

networks:
  observer_network:
